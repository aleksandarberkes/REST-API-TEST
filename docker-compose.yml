name: eventload

# Everything runs inside the Docker Desktop VM. Each service is pinned to its own
# cores (cpuset) so the load generator never competes with the system under test.
services:
  db:
    image: postgres:17.11-alpine
    cpuset: "${DB_CPUSET:-1-2}"
    mem_limit: "${DB_MEM:-2g}"
    environment:
      POSTGRES_USER: eventload
      POSTGRES_PASSWORD: eventload
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eventload"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    cpuset: "${API_CPUSET:-0}"
    mem_limit: "${API_MEM:-512m}"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://eventload:eventload@db:5432/eventload
      POOL_SIZE: "${POOL_SIZE:-10}"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Load generator, started on demand by the runner (`docker compose run k6 ...`).
  k6:
    image: grafana/k6:2.3.0
    profiles: ["tools"]
    cpuset: "${K6_CPUSET:-4-7}"
    working_dir: /load
    environment:
      BASE_URL: http://api:3000
    ports:
      - "5665:5665"
    volumes:
      - ./load:/load:ro
      - ./results:/results

volumes:
  pgdata:
